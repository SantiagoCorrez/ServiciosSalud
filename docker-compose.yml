version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - servicios-frontend
      - medicos-app
    restart: unless-stopped

  servicios-frontend:
    build: .
    image: servicios-salud-frontend
    # Solo exponer internamente (o mapear a otro puerto si es para debug)
    ports:
      - "8080:80"
    depends_on:
      - servicios-backend
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  servicios-backend:
    build:
      context: ./mapa-backend
    image: servicios-salud-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=servicios-db
      - DB_PORT=5432
      - DB_NAME=servicios_salud
      - DB_USER=postgres
      - DB_PASSWORD=Asdf123.
    volumes:
      - ./mapa-backend:/usr/src/app:cached
      - backend_node_modules:/usr/src/app/node_modules
    depends_on:
      servicios-db:
        condition: service_healthy
    restart: unless-stopped

  servicios-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=servicios_salud
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Asdf123.
    volumes:
      - servicios_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicios_salud"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medicos-app:
    build:
      context: ../medicos
      dockerfile: Dockerfile
    image: medicos-salud-app
    ports:
      - "3001:3001"
    environment:
      - PGHOST=medicos-db
      - PGUSER=postgres
      - PGPASSWORD=Asdf123.
      - PGDATABASE=micrositio_salud
      - PGPORT=5432
      - PORT=3001
    depends_on:
      - medicos-db
    restart: unless-stopped

  medicos-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=micrositio_salud
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Asdf123.
    volumes:
      - medicos_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: ["certbot"]
    restart: "no"

volumes:
  servicios_db_data:
  medicos_db_data:
  backend_node_modules:
